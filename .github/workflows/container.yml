name: Container image

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: docker build --file deploy/Containerfile --tag mingo-git-server:ci .

  publish:
    if: github.event_name != 'pull_request' && (github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=("$image:sha-$GITHUB_SHA")
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9][A-Za-z0-9_.-]{0,126}$ ]]; then
              echo "::error::Invalid version tag for GHCR."
              exit 1
            fi
            tags+=("$image:$GITHUB_REF_NAME")
          else
            tags+=("$image:latest")
          fi
          build_tags=()
          for tag in "${tags[@]}"; do
            build_tags+=(--tag "$tag")
          done
          docker build --file deploy/Containerfile "${build_tags[@]}" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
          printf '%s\n' "${tags[@]}" > "$RUNNER_TEMP/image-tags"
      - name: Push to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          while IFS= read -r tag; do
            docker push "$tag"
          done < "$RUNNER_TEMP/image-tags"
