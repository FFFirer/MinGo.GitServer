services:
  forge:
    build:
      context: ..
      dockerfile: deploy/Containerfile
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080;https://0.0.0.0:8443
      ASPNETCORE_Kestrel__Certificates__Default__Path: /run/tls/forge.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${MINGO_TLS_PASSWORD:?set MINGO_TLS_PASSWORD}
      Forge__AdminUser: ${MINGO_ADMIN_USER:-admin}
      Forge__AdminPassword: ${MINGO_ADMIN_PASSWORD:-}
    ports:
      - "${MINGO_BIND_ADDRESS:-127.0.0.1}:${MINGO_HTTPS_PORT:-8443}:8443"
    volumes:
      - forge-data:/data:U
      - ${MINGO_TLS_PFX:?set MINGO_TLS_PFX}:/run/tls/forge.pfx:ro,Z
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 3
    mem_limit: 768m
    cpus: 2
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev
    restart: unless-stopped
volumes:
  forge-data:
