map $http_host $forge_external_host {
    default "";
    git.example.com git.example.com;
    git.example.com:443 git.example.com:443;
    git.internal.example.com:8443 git.internal.example.com:8443;
}

server {
    listen 443 ssl default_server;
    listen 8443 ssl default_server;
    server_name git.example.com git.internal.example.com;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    if ($forge_external_host = "") { return 421; }

    client_max_body_size 256m;
    location / {
        proxy_pass http://forge:8080;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $forge_external_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
